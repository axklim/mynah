name: CI

on:
  pull_request:
  push:
    branches: [main]

# Note on what is NOT here: there are no integration tests. Every `mynah check`
# and `mynah translate` shells out to an authenticated `claude` CLI (Decision 0006),
# which CI has no way to sign in to. Build and unit tests are the honest ceiling.
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # IconFontCoverageTests skips itself when this font is absent — Decision 0008's
      # emoji fallback, which on a bare runner quietly retired the only automated check
      # on the codepoints that Finding nerd-font-codepoint-identity says must be verified.
      - name: Install the Nerd Font the icon-coverage test needs
        run: brew install --cask font-jetbrains-mono-nerd-font

      - name: Unit tests
        run: |
          set -euo pipefail
          make test 2>&1 | tee test.log
          # A skip here means the check above is not actually running. Fail loudly
          # rather than reporting green on a test that never executed.
          if grep -q "skipped" test.log; then
            echo "::error::a test skipped — CI is meant to run the whole suite"
            exit 1
          fi

      - name: Build the CLI
        run: make build

      # Needs full Xcode, which the runner image has and a plain CLT machine does
      # not — see mynah-vault/Findings/preview-macro-needs-xcode.md. This step is
      # therefore the only automated check that the app still compiles at all.
      - name: Build the app bundle
        run: make app

      # On a branch this is "0.0.0-dev" everywhere — the version's home is the git tag
      # (Decision 0013) and a checkout has no tag to speak of. The value is not the point:
      # that all three agree is what proves the stamping pipeline still works, and that is
      # what a release depends on when the value is real.
      - name: Version is consistent across the binary and the bundle
        run: |
          set -euo pipefail
          expected="$(make version)"
          binary="$(./cli/.build/release/mynah --version)"
          bundle="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' \
            cli/dist/Mynah.app/Contents/Info.plist)"
          echo "make=$expected binary=$binary bundle=$bundle"
          test "$binary" = "$expected"
          test "$bundle" = "$expected"

      # The release workflow renders this same template into axklim/homebrew-tap, where a
      # syntax slip or a lint regression only surfaces after the tag and the release are
      # already public. Graded here instead, on a placeholder checksum — neither `brew
      # style` nor `brew audit` fetches the URL.
      - name: The Homebrew formula still renders, lints and audits
        run: |
          set -euo pipefail
          V=9.9.9
          TAP="$(brew --repository)/Library/Taps/local/homebrew-pretap"
          rm -rf "$TAP"; mkdir -p "$TAP/Formula"
          make formula VERSION="$V" SHA256="$(printf '0%.0s' $(seq 64))" \
            > "$TAP/Formula/mynah.rb"
          brew style "$TAP/Formula/mynah.rb"
          brew audit --strict --formula local/pretap/mynah
          # Homebrew scans the version out of the URL rather than being told it, so a
          # formula that passes every other check can still resolve to garbage.
          resolved="$(brew info --json=v2 --formula local/pretap/mynah \
            | jq -r '.formulae[0].versions.stable')"
          test "$resolved" = "$V" || {
            echo "::error::formula resolves to version '$resolved', expected '$V'"
            exit 1
          }
          rm -rf "$TAP"

  # There is no separate formula job: the formula's template lives here (Decision 0013)
  # and is graded in the step above, while the release workflow audits the rendered result
  # against the asset it just published — which is stronger than linting a copy that never
  # gets installed.
