name: Release

# Manual on purpose. A release is a decision, not a consequence of pushing to main.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the leading v (e.g. 0.2.0)"
        required: true

permissions:
  contents: write

# Why the steps are in this order: the formula installs a *prebuilt* zip, so it must
# point at an asset that already exists — the release is published first, its checksum
# read from the file we just uploaded, and only then is the formula in axklim/homebrew-tap
# bumped. Nothing is compiled by Homebrew. See Decision 0011.
jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Validate the version and refuse to reuse a tag
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "::error::version must be X.Y.Z, got '$V'"; exit 1; }
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists"; exit 1
          fi

      - name: Bump the version in its single home
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          F=cli/Sources/MynahCore/MynahVersion.swift
          sed -i '' "s/current = \".*\"/current = \"$V\"/" "$F"
          # Trust `make version` over the sed above: if the file's shape ever changes,
          # this is where we find out, not three steps later in a broken release.
          test "$(make version)" = "$V" || { echo "::error::make version disagrees"; exit 1; }

      - name: Test and build before tagging anything
        run: |
          set -euo pipefail
          make test
          make build
          make app
          test "$(./cli/.build/release/mynah --version)" = "${{ inputs.version }}"

      - name: Commit the bump and tag it
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # main may already carry the target version — the constant is bumped in the
          # PR that adds the feature as often as not. `git commit` exits non-zero with
          # nothing staged, which under `set -e` would abort the release at the tag.
          if git diff --quiet HEAD; then
            echo "MynahVersion.swift is already $V; nothing to commit"
          else
            git commit -am "Release v$V"
          fi
          git tag -a "v$V" -m "mynah $V"
          git push origin main
          git push origin "v$V"

      - name: Package the CLI and the app into one zip
        # Two top-level entries on purpose. Homebrew strips a *single* top-level
        # directory when unpacking, and a bare .app IS one — zipping the bundle alone
        # would unpack into its own Contents. With `mynah` beside it nothing is
        # stripped, so the formula's `bin.install` / `prefix.install` both find their
        # artifact. -y keeps symlinks as symlinks rather than copying their targets.
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          mkdir -p dist
          cp cli/.build/release/mynah dist/mynah
          cp -R cli/dist/Mynah.app dist/Mynah.app
          (cd dist && zip -qry "mynah-$V-arm64.zip" mynah Mynah.app)
          shasum -a 256 "dist/mynah-$V-arm64.zip" | tee dist/zip-sha256.txt

      - name: Publish the release
        # Before the formula bump, not after: the formula points at this asset's URL
        # and checksum, so the asset has to exist first.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          ZIP_SHA="$(cut -d' ' -f1 dist/zip-sha256.txt)"
          cat > notes.md <<EOF
          ## Install

          \`\`\`sh
          brew install axklim/tap/mynah
          \`\`\`

          Installs both halves — the \`mynah\` CLI and the \`Mynah.app\` menu bar app — from
          the prebuilt \`mynah-$V-arm64.zip\` below. Apple silicon only. Needs an
          authenticated \`claude\` CLI; there is no API key.

          Start the menu bar app with \`brew services start mynah\`.

          sha256: \`$ZIP_SHA\`
          EOF
          gh release create "v$V" "dist/mynah-$V-arm64.zip" \
            --title "mynah $V" --notes-file notes.md

      - name: Bump the formula in axklim/homebrew-tap
        # GITHUB_TOKEN cannot reach another repository, so this needs TAP_TOKEN — a
        # fine-grained PAT with contents:write on axklim/homebrew-tap.
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          set -euo pipefail
          V="${{ inputs.version }}"
          URL="https://github.com/${{ github.repository }}/releases/download/v$V/mynah-$V-arm64.zip"
          SHA="$(cut -d' ' -f1 dist/zip-sha256.txt)"
          test -n "$SHA"
          git clone "https://x-access-token:$TAP_TOKEN@github.com/axklim/homebrew-tap.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sed -i '' -e "s|^  url \".*\"|  url \"$URL\"|" \
                    -e "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" \
                    -e "s|^  version \".*\"|  version \"$V\"|" Formula/mynah.rb
          # Re-running the workflow for an already-current formula would otherwise fail
          # here rather than proceeding to the verification below.
          if git diff --quiet HEAD; then
            echo "formula already points at v$V"
          else
            git commit -am "fix(mynah): bump to $V"
            git push origin HEAD:main
          fi

      - name: Verify a clean install through the tap
        # The real gate: tap and install exactly what a user gets — the published asset,
        # through the formula we just pushed. `brew test` asserts `mynah --version`
        # equals the formula's version, so a botched bump fails here.
        run: |
          set -euo pipefail
          brew tap axklim/tap
          brew trust --formula axklim/tap/mynah
          brew install axklim/tap/mynah
          brew test mynah
          brew audit --strict --formula axklim/tap/mynah
